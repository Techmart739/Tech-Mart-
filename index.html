<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Mart - Mobile Accessories</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 17px;
    }

    .hero {
      text-align: center;
      padding: 30px 15px;
      background: white;
    }

    .hero h2 {
      font-size: 28px;
      margin: 5px;
    }

    .hero p {
      font-size: 18px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 25px;
      max-width: 1000px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    .product img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 10px;
    }

    .product h3 {
      margin: 12px 0 5px;
    }

    .price {
      color: #e63946;
      font-size: 22px;
      font-weight: bold;
    }

    .order {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Tech Mart</h1>
  <p>Mobile Accessories & Tech Products</p>
</header>

<section class="hero">
  <h2>Welcome to Tech Mart</h2>
  <p>Best Products • Best Prices • Trusted Service</p>
</section>

<section class="products">

  <div class="product">
    <img src="1786371284873.jpg" alt="Tech Mart Product">
    <h3>Mobile Accessory</h3>
    <div class="price">Rs. 160</div>
    <a class="order" href="https://wa.me/923070666739">Order on WhatsApp</a>
  </div>

</section>

<footer>
  <p>Tech Mart</p>
  <p>Contact: 0307-0666739</p>
</footer>

</body>
</html>
